<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>개선 의견</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Arial,
                "Noto Sans KR",
                sans-serif;
            background: #f7f4f5;
            color: #222;
        }

        .opinion-page {
            width: min(100%, 700px);
            margin: 0 auto;
            padding: 30px 16px 60px;
        }

        .opinion-card {
            background: white;
            border: 1px solid #eadcdf;
            border-radius: 16px;
            padding: 24px;
        }

        .opinion-card h1 {
            margin: 0 0 10px;
            font-size: 26px;
        }

        .opinion-description {
            margin: 0 0 20px;
            color: #777;
            font-size: 14px;
        }

        #opinionForm {
            width: 100%;
        }

        #opinionInput {
            display: block;
            width: 100%;
            min-height: 150px;
            resize: vertical;

            padding: 15px;

            border: 1px solid #ddd;
            border-radius: 10px;

            font-size: 15px;
            line-height: 1.6;

            outline: none;
        }

        #opinionInput:focus {
            border-color: #a50d24;
        }

        #opinionSubmit {
            display: block;
            width: 100%;

            margin-top: 12px;
            padding: 14px;

            border: 0;
            border-radius: 10px;

            background: #a50d24;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        #opinionSubmit:disabled {
            opacity: 0.5;
            cursor: default;
        }

        #opinionMessage {
            min-height: 24px;
            margin-top: 14px;

            font-size: 13px;
            line-height: 1.5;
        }

        #opinionMessage.success {
            color: #16833a;
        }

        #opinionMessage.error {
            color: #d11b32;
        }

        #opinionList {
            margin-top: 25px;
        }

        .opinion-empty {
            padding: 25px 0;
            text-align: center;
            color: #888;
            font-size: 14px;
        }

        .opinion-error {
            color: #d11b32;
            font-size: 14px;
            line-height: 1.6;
        }

        .opinion-item {
            padding: 18px 0;
            border-top: 1px solid #eee;
        }

        .opinion-content {
            white-space: pre-wrap;
            word-break: break-word;

            font-size: 15px;
            line-height: 1.7;
        }

        .opinion-info {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-top: 12px;

            color: #999;
            font-size: 12px;
        }

        .opinion-info span:first-child {
            color: #555;
            font-weight: bold;
        }

        .opinion-delete {
            margin-left: auto;

            border: 0;
            background: transparent;

            color: #999;
            font-size: 12px;

            cursor: pointer;
        }

        .opinion-delete:hover {
            color: #d11b32;
        }


        /* 휴대폰 */

        @media (max-width: 600px) {

            .opinion-page {
                padding:
                    20px 12px 40px;
            }

            .opinion-card {
                padding: 18px;
                border-radius: 14px;
            }

            .opinion-card h1 {
                font-size: 22px;
            }

            #opinionInput {
                min-height: 130px;
                font-size: 14px;
            }

            #opinionSubmit {
                padding: 13px;
            }

            .opinion-info {
                flex-wrap: wrap;
            }
        }

    </style>
</head>


<body>

    <main class="opinion-page">

        <section class="opinion-card">

            <h1>개선 의견</h1>

            <p class="opinion-description">
                교육과 관련된 개선 의견을 남겨주세요.
            </p>


            <!-- 의견 입력 -->

            <form id="opinionForm">

                <textarea
                    id="opinionInput"
                    placeholder="개선 의견을 입력해주세요."
                    maxlength="2000"
                    required
                ></textarea>

                <button
                    id="opinionSubmit"
                    type="submit"
                >
                    의견 제출
                </button>

            </form>


            <!-- 결과 메시지 -->

            <div id="opinionMessage"></div>


            <!-- 의견 목록 -->

            <div id="opinionList">
                의견을 불러오는 중입니다...
            </div>

        </section>

    </main>


    


<script>
/* =========================================================
   개선 의견 - 최종 버전
   Supabase table: public.opinions
   Columns: id, created_at, content, author

   주의:
   이 파일을 기존 사이트에 넣을 경우, 기존 Supabase 연결 코드에서
   window.supabaseClient 또는 supabaseClient가 이미 생성되어 있어야 합니다.
========================================================= */

(function () {
    "use strict";

    let opinions = [];

    function getClient() {
        if (window.supabaseClient) return window.supabaseClient;
        if (typeof supabaseClient !== "undefined") return supabaseClient;
        throw new Error("supabaseClient가 연결되어 있지 않습니다.");
    }

    function escapeHTML(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function message(text, isError) {
        const box = document.getElementById("opinionMessage");
        if (!box) return;
        box.textContent = text || "";
        box.className = isError ? "error" : "success";
    }

    async function loadOpinions() {
        const list = document.getElementById("opinionList");
        if (!list) return;

        list.innerHTML =
            '<div class="opinion-empty">의견을 불러오는 중입니다...</div>';

        try {
            const client = getClient();

            const { data, error } = await client
                .from("opinions")
                .select("id, created_at, content, author")
                .order("created_at", { ascending: false });

            if (error) throw error;

            opinions = data || [];

            if (!opinions.length) {
                list.innerHTML =
                    '<div class="opinion-empty">아직 등록된 의견이 없습니다.</div>';
                return;
            }

            list.innerHTML = opinions.map(function (item, index) {
                const date = item.created_at
                    ? new Date(item.created_at).toLocaleString("ko-KR")
                    : "";

                return `
                    <article class="opinion-item">
                        <div class="opinion-content">
                            ${escapeHTML(item.content)}
                        </div>

                        <div class="opinion-info">
                            <span>${escapeHTML(item.author || "사용자")}</span>
                            <span>${escapeHTML(date)}</span>

                            <button
                                type="button"
                                class="opinion-delete"
                                data-index="${index}">
                                삭제
                            </button>
                        </div>
                    </article>
                `;
            }).join("");

            list.querySelectorAll(".opinion-delete").forEach(function (button) {
                button.addEventListener("click", function () {
                    deleteOpinion(Number(button.dataset.index));
                });
            });

        } catch (error) {
            console.error("OPINION_LOAD_ERROR:", error);

            list.innerHTML =
                '<div class="opinion-error">의견을 불러오지 못했습니다.<br>' +
                escapeHTML(error.message) +
                '</div>';
        }
    }

    async function submitOpinion() {
        const input = document.getElementById("opinionInput");
        const button = document.getElementById("opinionSubmit");

        if (!input || !button) return;

        const content = input.value.trim();

        if (!content) {
            message("의견을 입력해주세요.", true);
            return;
        }

        button.disabled = true;
        message("의견을 등록하는 중입니다...", false);

        try {
            const client = getClient();

            const { error } = await client
                .from("opinions")
                .insert({
                    content: content,
                    author: "사용자"
                });

            if (error) throw error;

            input.value = "";
            message("의견이 등록되었습니다.", false);

            await loadOpinions();

        } catch (error) {
            console.error("OPINION_INSERT_ERROR:", error);

            message(
                "의견 등록에 실패했습니다: " + error.message,
                true
            );

        } finally {
            button.disabled = false;
        }
    }

    async function deleteOpinion(index) {
        const item = opinions[index];

        if (!item || item.id === null || item.id === undefined) {
            message("삭제할 의견을 찾을 수 없습니다.", true);
            return;
        }

        if (!confirm("이 의견을 삭제할까요?")) return;

        try {
            const client = getClient();

            const { error } = await client
                .from("opinions")
                .delete()
                .eq("id", item.id);

            if (error) throw error;

            message("의견이 삭제되었습니다.", false);
            await loadOpinions();

        } catch (error) {
            console.error("OPINION_DELETE_ERROR:", error);

            message(
                "의견 삭제에 실패했습니다: " + error.message,
                true
            );
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("opinionForm");

        if (form) {
            form.addEventListener("submit", function (event) {
                event.preventDefault();
                submitOpinion();
            });
        }

        loadOpinions();
    });

    window.loadOpinions = loadOpinions;
    window.submitOpinion = submitOpinion;
    window.deleteOpinion = deleteOpinion;
})();
</script>

</body>
</html>
