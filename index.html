<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8f1020">
<title>해병대 교육 통합관리 시스템</title>

<style>
*{box-sizing:border-box}
:root{
  --red:#8f1020;
  --light:#f8e8eb;
  --text:#2d2426;
  --muted:#806f73;
  --line:#eadde0;
}
body{
  margin:0;
  background:#f3eeee;
  font-family:Arial,"Noto Sans KR",sans-serif;
  color:var(--text);
}
.app{
  width:min(100%,460px);
  margin:auto;
  background:#fbf7f8;
  min-height:100vh;
  box-shadow:0 0 24px #234d4020;
}
.header{
  background:#fff;
  padding:16px 17px 10px;
  border-bottom:1px solid var(--line);
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}
.brand{
  font-size:13px;
  font-weight:700;
  color:#876f73;
}
.brand strong{
  display:block;
  font-size:23px;
  color:var(--red);
  margin-top:3px;
}
.percent{
  text-align:right;
  color:var(--red);
  font-size:28px;
  font-weight:900;
  line-height:1;
}
.percent small{
  display:block;
  font-size:10px;
  font-weight:600;
  margin-top:5px;
  color:#799187;
}
.progressText{
  display:flex;
  justify-content:space-between;
  margin-top:12px;
  font-size:12px;
  color:#7d676c;
}
.bar{
  height:5px;
  background:#eee2e4;
  border-radius:5px;
  margin-top:5px;
  overflow:hidden;
}
.bar i{
  display:block;
  height:100%;
  width:0;
  background:var(--red);
}
.tabs{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:7px 14px;
}
.tab{
  border:0;
  background:#fff;
  padding:11px 5px;
  border-radius:9px;
  color:#604c50;
  font-weight:800;
  font-size:13px;
}
.tab.active{background:#f6e4e7}
.section{padding:18px 15px}
.sectionTitle{
  display:flex;
  align-items:center;
  gap:7px;
  color:#754e55;
  font-weight:800;
  font-size:12px;
  margin:3px 5px 10px;
}
.sectionTitle .num{
  width:22px;
  height:22px;
  background:#f5e1e5;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:11px;
}
.line{height:1px;background:#dce9e4;flex:1}
.card{
  background:#fff;
  border:1px solid #e0ebe7;
  border-radius:13px;
  padding:12px;
  margin:8px 0;
  box-shadow:0 3px 10px #326c5912;
}
.card.doneCard{
  background:#e8f4ef;
  border-color:#c4ddd3;
}
.row{
  display:grid;
  grid-template-columns:30px 1fr 104px;
  gap:8px;
  align-items:start;
}
.check{
  width:27px;
  height:27px;
  border:2px solid #d9a6af;
  border-radius:50%;
  background:#fff;
  cursor:pointer;
  margin-top:4px;
}
.check.done{
  background:var(--red);
  border-color:var(--red);
  position:relative;
}
.check.done:after{
  content:"✓";
  color:#fff;
  position:absolute;
  left:5px;
  top:2px;
  font-size:16px;
  font-weight:bold;
}
.name{
  font-size:14px;
  font-weight:800;
  margin-top:3px;
}
.card.doneCard .name{
  text-decoration:line-through;
  color:#7b8582;
}
.tag{
  display:inline-block;
  background:#f5e1e5;
  color:var(--red);
  border-radius:4px;
  padding:3px 6px;
  font-size:10px;
  margin-top:6px;
}
.date{
  float:right;
  background:#f9eadf;
  color:#a35d31;
  padding:4px 6px;
  border-radius:5px;
  font-size:10px;
}
.greenNote{
  font-size:10px;
  color:#95626b;
  margin-top:5px;
}
.rednote{
  font-size:10px;
  color:#b52232;
  font-weight:700;
  margin-top:5px;
}
.actions{
  display:flex;
  flex-direction:column;
  gap:6px;
  justify-content:center;
}
.actions button,.btn{
  width:100%;
  border-radius:9px;
  padding:10px 4px;
  font-weight:800;
  font-size:12px;
  cursor:pointer;
}
.study,.btn{
  border:0;
  background:var(--red);
  color:#fff;
}
.complete{
  margin-top:6px;
  border:1px solid #d9b9bf;
  background:#fff;
  color:#7d5960;
}
.completeBtn{
  border:0!important;
  background:#3f67a2!important;
  color:#fff!important;
}
.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  margin:7px 0 0 35px;
}
.choice{
  border:1px dashed #c99ca5;
  background:#fff;
  border-radius:7px;
  padding:7px;
  font-size:10px;
  color:#80555d;
  cursor:pointer;
}
.choice.selected{
  background:var(--red);
  border-color:var(--red);
  color:#fff;
  font-weight:800;
}
.panel{display:none}
.panel.active{display:block}
.notice{
  font-size:11px;
  color:var(--muted);
  line-height:1.6;
  margin-top:14px;
}
.recordBox,.opinionBox{
  background:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  padding:15px;
}
.recordBox input,.opinionBox textarea{
  width:100%;
  padding:10px;
  border:1px solid var(--line);
  border-radius:8px;
  margin:8px 0;
  font:inherit;
}
.recordItem{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 0;
  border-top:1px solid var(--line);
  font-size:12px;
}
.recordItem .rname{flex:1;font-weight:700}
.recordDelete,.opDelete{
  border:1px solid #d9b9bf;
  background:#fff;
  color:var(--red);
  border-radius:7px;
  padding:6px 9px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}
.opThread{
  border:1px solid var(--line);
  border-radius:11px;
  background:#fff;
  margin-top:10px;
  padding:11px;
}
.opHead{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:11px;
  color:var(--muted);
}
.opAuthor{font-weight:800;color:#321c20}
.opText{
  font-size:12px;
  line-height:1.55;
  margin:8px 0;
  white-space:pre-wrap;
}
.opEmpty{
  font-size:11px;
  color:var(--muted);
  padding:12px 0;
}
.opError{
  font-size:11px;
  color:#b52232;
  line-height:1.5;
  padding:12px 0;
}
.toast{
  display:none;
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  background:#321c20;
  color:#fff;
  padding:10px 15px;
  border-radius:9px;
  font-size:12px;
  z-index:10;
}
@media(min-width:461px){
  body{padding:20px 0}
  .app{border-radius:18px;overflow:hidden}
}
</style>
</head>

<body>
<div class="app">

<header class="header">
  <div class="top">
    <div class="brand">
      해병대 교육 통합관리 시스템
      <strong>MARINE EDU-PASS</strong>
    </div>
    <div class="percent">
      <span id="pct">0%</span>
      <small>이수율</small>
    </div>
  </div>

  <div class="progressText">
    <span id="count">0 / 0개 기준 완료</span>
    <span>진행 중</span>
  </div>
  <div class="bar"><i id="bar"></i></div>
</header>

<nav class="tabs">
  <button class="tab active" onclick="tab('edu',this)">교육 목록</button>
  <button class="tab" onclick="tab('record',this)">기록변경</button>
  <button class="tab" onclick="tab('opinion',this)">개선 의견</button>
</nav>

<main id="edu" class="panel active section">
  <div class="sectionTitle">
    <span class="num">1</span>
    법정 필수 및 인권 교육
    <span class="line"></span>
    <span>▲</span>
  </div>

  <div id="list"></div>

  <div class="notice">
    ※ 성인지 교육은 원격교육·소집교육을 모두 선택해야 수료됩니다.<br>
    ※ 자살예방교육은 전반기·후반기를 모두 선택해야 수료됩니다.<br>
    ※ 개인정보 보호 교육은 개인정보배움터로 연결됩니다.<br>
    ※ 통일교육은 통일부 국립평화통일민주교육원으로 연결됩니다.
  </div>
</main>

<section id="record" class="panel section">
  <div class="recordBox">
    <h3>기록변경</h3>
    <p style="font-size:12px;color:#806f73">
      교육명을 입력하면 수료 기록으로 추가할 수 있습니다.
    </p>

    <input id="newName" placeholder="교육명 입력">
    <button class="btn" onclick="addRecord()">수료 기록 추가</button>

    <div id="recordList" style="margin-top:14px"></div>
  </div>
</section>

<section id="opinion" class="panel section">
  <div class="opinionBox">
    <h3>개선 의견</h3>

    <p style="font-size:12px;color:#806f73">
      교육과 관련된 개선 의견을 남겨주세요.
    </p>

    <textarea
      id="op"
      rows="5"
      placeholder="개선 의견을 입력해주세요."
    ></textarea>

    <button class="btn" onclick="sendOpinion()">
      의견 제출
    </button>

    <div id="opinionList" style="margin-top:16px"></div>
  </div>
</section>

</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* =====================================================
   Supabase
===================================================== */

const SUPABASE_URL =
  "https://ouvbmumjdhuuhejnhcmj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_JxRxNMk49-71jE7RYaTlGQ_GyjzNYYK";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   외부 교육 사이트
===================================================== */

const PRIVACY_URL =
  "https://edu.privacy.go.kr/user/course/uCrsRcmdList.do";

const UNIEDU_URL =
  "https://www.uniedu.go.kr/uniedu/home/cms/page/uniedu/main.do?mid=SM00000865";


/* =====================================================
   교육 목록
===================================================== */

const base = [
  {
    name:"성인지 교육 (국방부)",
    date:"3/16 ~ 12/31",
    note:"원격·소집교육 모두 수강해야 이수 완료됩니다",
    choices:["원격교육","소집교육"]
  },
  {
    name:"자살사고예방교육 (생명사랑)",
    date:"",
    note:"전반기 신청·수강 2/16 ~ 6/30",
    note2:"후반기 신청·수강 7/1 ~ 12/31",
    red:"전반기·후반기 각각 수강해야 이수 완료됩니다",
    choices:["전반기","후반기"]
  },
  {
    name:"개인정보 보호 교육",
    date:"연중",
    privacy:true,
    note:"개인정보배움터 추천 교육과정에서 교육을 선택해 수강하세요."
  },
  {
    name:"통일교육",
    date:"연중",
    unification:true,
    note:"통일부 국립평화통일민주교육원에서 교육과정을 선택해 수강하세요."
  },
  {
    name:"청렴교육",
    date:"매월 1~25일",
    red:"'청렴' 검색 → 학습시간 확인 후 선택",
    complete:true
  },
  {
    name:"사이버 인권 교육",
    date:"1/1 ~ 12/31",
    complete:true
  },
  {
    name:"장애인 인식 개선 교육",
    date:"1/1 ~ 12/31"
  },
  {
    name:"아동학대 예방 교육",
    date:"1/6 ~ 12/31"
  }
];


/* =====================================================
   로컬 저장 데이터
===================================================== */

let data;

try {
  const saved =
    JSON.parse(localStorage.getItem("marineLike") || "null");

  data = saved || base.map(x => ({
    ...x,
    done:false,
    selected:x.choices
      ? x.choices.map(() => false)
      : []
  }));

} catch(e) {

  data = base.map(x => ({
    ...x,
    done:false,
    selected:x.choices
      ? x.choices.map(() => false)
      : []
  }));

}

data = data.map(x => ({
  ...x,
  selected:
    x.selected ||
    (x.choices ? x.choices.map(() => false) : [])
}));


/* =====================================================
   화면 렌더링
===================================================== */

function render(){

  const list =
    document.getElementById("list");

  list.innerHTML = "";

  data.forEach((x,i)=>{

    const d =
      document.createElement("div");

    d.className =
      "card" + (x.done ? " doneCard" : "");

    let studyButton = "";

    if(!x.done){

      if(x.privacy){

        studyButton =
          `<button class="study"
            onclick="openPrivacy()">
            수강하기
          </button>`;

      } else if(x.unification){

        studyButton =
          `<button class="study"
            onclick="openUniedu()">
            수강하기
          </button>`;

      } else {

        studyButton =
          `<button class="study"
            onclick="openNhi()">
            수강하기
          </button>`;
      }
    }

    let completeButton = "";

    if(!x.choices){

      completeButton =
        `<button
          class="${x.done ? "study completeBtn" : "complete"}"
          onclick="toggle(${i})">
          ${x.done ? "✓ 수강완료" : "수강완료"}
        </button>`;
    }

    let choicesHTML = "";

    if(x.choices){

      choicesHTML = `
        <div class="choices">
          ${x.choices.map((c,j)=>`

            <button
              class="choice ${x.selected[j] ? "selected" : ""}"
              onclick="selectChoice(${i},${j})">

              ${x.selected[j] ? "✓ " : ""}
              ${c}
              ${x.selected[j] ? " 완료" : ""}

            </button>

          `).join("")}
        </div>
      `;
    }

    d.innerHTML = `
      <div class="row">

        <button
          class="check ${x.done ? "done" : ""}"
          aria-label="수료 상태"
          onclick="toggle(${i})">
        </button>

        <div>

          <div class="name">
            ${escapeHTML(x.name)}
          </div>

          <span class="tag">
            ${
              x.privacy
              ? "개인정보배움터"
              : x.unification
              ? "국립평화통일민주교육원"
              : "나라배움터"
            }
          </span>

          ${
            x.date
            ? `<span class="date">${escapeHTML(x.date)}</span>`
            : ""
          }

          ${
            x.note
            ? `<div class="greenNote">${escapeHTML(x.note)}</div>`
            : ""
          }

          ${
            x.note2
            ? `<div class="greenNote">${escapeHTML(x.note2)}</div>`
            : ""
          }

          ${
            x.red
            ? `<div class="rednote">⚠ ${escapeHTML(x.red)}</div>`
            : ""
          }

        </div>

        <div class="actions">
          ${studyButton}
          ${completeButton}
        </div>

      </div>

      ${choicesHTML}
    `;

    list.appendChild(d);
  });

  updateProgress();
  renderRecords();
}


/* =====================================================
   교육 상태
===================================================== */

function selectChoice(i,j){

  if(!data[i].selected){

    data[i].selected =
      data[i].choices.map(() => false);
  }

  data[i].selected[j] =
    !data[i].selected[j];

  data[i].done =
    data[i].selected.every(Boolean);

  saveData();
  render();

  toast(
    data[i].selected[j]
    ? "선택 완료"
    : "선택 취소"
  );
}


function toggle(i){

  data[i].done =
    !data[i].done;

  saveData();
  render();

  toast(
    data[i].done
    ? "수료 처리되었습니다."
    : "수료 처리가 취소되었습니다."
  );
}


function updateProgress(){

  const n =
    data.filter(x => x.done).length;

  const total =
    data.length;

  const p =
    total
    ? Math.round(n / total * 100)
    : 0;

  document.getElementById("pct").textContent =
    p + "%";

  document.getElementById("count").textContent =
    n + " / " + total + "개 기준 완료";

  document.getElementById("bar").style.width =
    p + "%";
}


function saveData(){

  localStorage.setItem(
    "marineLike",
    JSON.stringify(data)
  );
}


/* =====================================================
   교육 사이트
===================================================== */

function openPrivacy(){

  window.open(
    PRIVACY_URL,
    "_blank",
    "noopener,noreferrer"
  );
}


function openUniedu(){

  window.open(
    UNIEDU_URL,
    "_blank",
    "noopener,noreferrer"
  );
}


function openNhi(){

  window.open(
    "https://mnd.nhi.go.kr/",
    "_blank",
    "noopener,noreferrer"
  );
}


/* =====================================================
   탭
===================================================== */

function tab(id,button){

  document
    .querySelectorAll(".panel")
    .forEach(x =>
      x.classList.remove("active")
    );

  document
    .getElementById(id)
    .classList.add("active");

  document
    .querySelectorAll(".tab")
    .forEach(x =>
      x.classList.remove("active")
    );

  button.classList.add("active");

  if(id === "opinion"){
    loadOpinions();
  }
}


/* =====================================================
   기록 변경
===================================================== */

function renderRecords(){

  const box =
    document.getElementById("recordList");

  if(!box) return;

  const records =
    data
      .map((x,i)=>({x,i}))
      .filter(({x}) => x.date === "직접 기록");

  if(!records.length){

    box.innerHTML =
      '<div style="font-size:11px;color:#806f73;padding-top:10px">직접 추가한 수료 기록이 없습니다.</div>';

    return;
  }

  box.innerHTML =
    '<div style="font-size:11px;color:#806f73;margin-bottom:5px">직접 추가한 기록</div>' +

    records.map(({x,i}) => `

      <div class="recordItem">

        <span class="rname">
          ${escapeHTML(x.name)}
        </span>

        <button
          class="recordDelete"
          onclick="deleteRecord(${i})">
          삭제
        </button>

      </div>

    `).join("");
}


function addRecord(){

  const input =
    document.getElementById("newName");

  const v =
    input.value.trim();

  if(!v){

    toast("교육명을 입력해주세요.");
    return;
  }

  data.push({
    name:v,
    date:"직접 기록",
    done:true,
    selected:[],
    url:""
  });

  input.value = "";

  saveData();
  render();

  toast("수료 기록을 추가했습니다.");
}


function deleteRecord(i){

  if(data[i]?.date !== "직접 기록")
    return;

  if(!confirm("이 수료 기록을 삭제할까요?"))
    return;

  data.splice(i,1);

  saveData();
  render();

  toast("수료 기록을 삭제했습니다.");
}


/* =====================================================
   의견 기능
   Supabase 테이블: 의견
   컬럼: id, created_at, 콘텐츠, 작성자
===================================================== */

let opinions = [];


async function loadOpinions(){

  const box =
    document.getElementById("opinionList");

  if(!box) return;

  box.innerHTML =
    '<div class="opEmpty">의견을 불러오는 중입니다...</div>';

  const result =
    await supabaseClient
      .from("opinions")
      .select("id,created_at,콘텐츠,작가")
      .order("created_at", {ascending:false});

  if(result.error){

    console.error(
      "의견 불러오기 오류:",
      result.error
    );

    box.innerHTML = `
      <div class="opError">
        의견을 불러오지 못했습니다.<br>
        ${escapeHTML(result.error.message)}
      </div>
    `;

    return;
  }

  opinions =
    result.data || [];

  renderOpinions();
}


function renderOpinions(){

  const box =
    document.getElementById("opinionList");

  if(!box) return;

  if(!opinions.length){

    box.innerHTML =
      '<div class="opEmpty">아직 등록된 개선 의견이 없습니다.</div>';

    return;
  }

  box.innerHTML =
    opinions.map((o,i)=>{

      const date =
        o.created_at
        ? new Date(o.created_at)
            .toLocaleString("ko-KR")
        : "";

      return `
        <div class="opThread">

          <div class="opHead">

            <span class="opAuthor">
              #${String(opinions.length-i).padStart(2,"0")}
            </span>

            <span>
              ${escapeHTML(date)}
            </span>

          </div>

          <div class="opText">
            ${escapeHTML(o.콘텐츠 || "")}
          </div>

          <button
            class="opDelete"
            onclick="deleteOpinion(${i})">
            내 의견 삭제
          </button>

        </div>
      `;

    }).join("");
}


async function sendOpinion(){

  const input =
    document.getElementById("op");

  if(!input){

    console.error("의견 입력창을 찾을 수 없습니다.");
    return;
  }

  const text =
    input.value.trim();

  if(!text){

    toast("의견을 입력해주세요.");
    return;
  }

  const result =
    await supabaseClient
      .from("opinions")
      .insert([
        {
          콘텐츠:text,
          작가:"사용자"
        }
      ])
      .select();

  if(result.error){

    console.error(
      "의견 등록 오류:",
      result.error
    );

    alert(
      "의견 등록에 실패했습니다.\n\n" +
      result.error.message
    );

    return;
  }

  input.value = "";

  toast("의견이 등록되었습니다.");

  await loadOpinions();
}


async function deleteOpinion(i){

  const opinion =
    opinions[i];

  if(!opinion?.id)
    return;

  if(!confirm("이 의견을 삭제할까요?"))
    return;

  const result =
    await supabaseClient
      .from("opinions")
      .delete()
      .eq("id", opinion.id);

  if(result.error){

    console.error(
      "의견 삭제 오류:",
      result.error
    );

    alert(
      "의견 삭제에 실패했습니다.\n\n" +
      result.error.message
    );

    return;
  }

  toast("의견을 삭제했습니다.");

  await loadOpinions();
}


/* =====================================================
   실시간 의견 갱신
===================================================== */

supabaseClient
  .channel("marine-edu-opinions")
  .on(
    "postgres_changes",
    {
      event:"*",
      schema:"public",
      table:"의견"
    },
    function(){
      loadOpinions();
    }
  )
  .subscribe();


/* =====================================================
   공통
===================================================== */

function escapeHTML(value){

  return String(value ?? "").replace(
    /[&<>"']/g,
    function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[m];

    }
  );
}


function toast(message){

  const box =
    document.getElementById("toast");

  if(!box) return;

  box.textContent =
    message;

  box.style.display =
    "block";

  clearTimeout(window.__toastTimer);

  window.__toastTimer =
    setTimeout(function(){

      box.style.display =
        "none";

    },2000);
}


/* =====================================================
   시작
===================================================== */

render();
loadOpinions();

</script>
</body>
</html>
